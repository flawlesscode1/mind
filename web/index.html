<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>MIND — Game Runtime</title>
<style>
:root{color-scheme:dark;font-family:system-ui,sans-serif}body{background:#101522;color:#f4f7ff;margin:0;display:grid;place-items:center;min-height:100vh}
main{width:min(94vw,650px)}h1{margin-bottom:4px}p{color:#b5bfd2}canvas{display:block;width:100%;background:#19243b;border:1px solid #4c6489;border-radius:12px;image-rendering:pixelated}
#status{font-weight:700;color:#92e8d2;min-height:1.5em}kbd{border:1px solid #63758d;padding:2px 6px;border-radius:4px}
button{background:#496cda;color:white;border:0;padding:10px 16px;border-radius:8px;cursor:pointer}
</style>
</head>
<body><main>
<h1 id="title">MIND runtime</h1><p>Move with <kbd>W</kbd><kbd>A</kbd><kbd>S</kbd><kbd>D</kbd> or arrow keys. Collect the yellow stars.</p>
<canvas id="game" width="640" height="480" aria-label="Game board"></canvas>
<p id="status" role="status">Loading .mind program…</p><button id="restart" type="button" disabled>Restart</button>
<p>Game mechanics are interpreted from <code>examples/first_game.mind</code>.</p>
</main>
<script type="module">
import { parse, start, move } from "/mind.js";
const canvas = document.querySelector("#game");
const ctx = canvas.getContext("2d");
const status = document.querySelector("#status");
const title = document.querySelector("#title");
const cell = 40, cols = canvas.width / cell, rows = canvas.height / cell;
let program, state;
function draw(){
  ctx.clearRect(0,0,canvas.width,canvas.height);
  ctx.strokeStyle="#293754";
  for(let x=0;x<=cols;x++){ctx.beginPath();ctx.moveTo(x*cell,0);ctx.lineTo(x*cell,canvas.height);ctx.stroke()}
  for(let y=0;y<=rows;y++){ctx.beginPath();ctx.moveTo(0,y*cell);ctx.lineTo(canvas.width,y*cell);ctx.stroke()}
  for(const e of state.remaining){
    ctx.fillStyle="#ffd45b";ctx.beginPath();ctx.arc((e.x+.5)*cell,(e.y+.5)*cell,13,0,Math.PI*2);ctx.fill();
  }
  ctx.fillStyle="#6fe6d0";ctx.fillRect(state.player.x*cell+6,state.player.y*cell+6,cell-12,cell-12);
  status.textContent=state.won?`YOU WON! Collected ${state.collected}/${program.target}`:`Collected ${state.collected}/${program.target}`;
}
function reset(){state=start(program);draw()}
document.querySelector("#restart").addEventListener("click",()=>{if(program)reset()});
window.addEventListener("keydown",event=>{
  if(!program || !state || event.altKey || event.ctrlKey || event.metaKey)return;
  const dirs={ArrowUp:[0,-1],w:[0,-1],ArrowDown:[0,1],s:[0,1],ArrowLeft:[-1,0],a:[-1,0],ArrowRight:[1,0],d:[1,0]};
  const dir=dirs[event.key];if(!dir)return;event.preventDefault();
  const x=state.player.x+dir[0],y=state.player.y+dir[1];
  if(x<0||y<0||x>=cols||y>=rows)return;
  state=move(program,state,...dir);draw();
});
try{
  const response=await fetch("/game.mind");
  if(!response.ok)throw new Error("Unable to load .mind source");
  const candidate=parse(await response.text());
  const all=[candidate.player,...candidate.collectibles];
  if(all.some(e=>e.x<0||e.y<0||e.x>=cols||e.y>=rows))throw new Error("Entity outside 16×12 demo grid");
  program=candidate;
  title.textContent=program.title+" — MIND";
  reset();
  document.querySelector("#restart").disabled=false;
}catch(error){program=undefined;state=undefined;document.querySelector("#restart").disabled=true;status.textContent="Error: "+error.message;console.error(error)}
</script>
</body></html>
