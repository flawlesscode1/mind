name: Publish MIND playground
on:
  push:
    branches: [main, feat/github-pages-playground]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: mind-pages-${{ github.event_name == 'pull_request' && github.ref || 'production' }}
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm test
      - run: npm run build:pages
      - run: npx playwright install --with-deps chromium
      - run: npm run test:pages
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    outputs:
      page_url: ${{ steps.deployment.outputs.page_url }}
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/deploy-pages@v4
        id: deployment

  verify-public:
    if: github.event_name != 'pull_request'
    needs: deploy
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npx playwright install --with-deps chromium
      - name: Verify deployed public interpreter and game
        env:
          MIND_PUBLIC_URL: ${{ needs.deploy.outputs.page_url }}
          MIND_EXPECTED_REVISION: ${{ github.sha }}
        run: node scripts/test-pages.mjs "$MIND_PUBLIC_URL"
