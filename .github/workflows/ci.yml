name: MIND conformance
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-24.04, macos-15]
        node: [20, 22, 24]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm test
      - run: npm run demo
      - name: Build and smoke-test static playground on macOS
        if: runner.os == 'macOS' && matrix.node == 24
        run: |
          npm run build:pages
          npx playwright install chromium
          npm run test:pages
      - run: git diff --exit-code
